name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: 测试（Linux）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: 安装中文字体
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-arphic-uming
          # Noto CJK 的 CFF 集合无法被当前 PDF 子集化器处理；用 AR PL UMing
          # （TrueType，含拉丁与中文）跑测试。
          echo "TENGHSHOU_FONT=/usr/share/fonts/truetype/arphic/uming.ttc" >> "$GITHUB_ENV"
      - name: 静态检查
        run: |
          test -z "$(gofmt -l ./cmd ./internal)"
          go vet ./internal/... ./cmd/tengshou-cli
      - name: 单元与集成测试
        run: go test -count=1 ./internal/... ./cmd/tengshou-cli

  frontend:
    name: 前端工程约束与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 结构预算棘轮
        run: bash scripts/check-frontend-structure.sh
      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci
      - name: 类型检查（strict）
        working-directory: frontend
        run: npm run typecheck
      - name: 构建 Vue 岛产物
        working-directory: frontend
        run: npm run build
      - name: 校验 dist 产物
        run: |
          test -f internal/httpapi/web/app/dist/tengshou-ui.js
          test -f internal/httpapi/web/app/dist/tengshou-ui.css
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: internal/httpapi/web/app/dist
          include-hidden-files: true
          if-no-files-found: error

  cli:
    name: 构建 CLI（${{ matrix.goos }}/${{ matrix.goarch }}）
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: 取回前端构建产物（go:embed 需要）
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: internal/httpapi/web/app/dist
      - name: 构建
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          VERSION="${GITHUB_REF_NAME:-0.1.0-dev}"
          go build -trimpath -ldflags "-s -w \
            -X github.com/LuSrackhall/tengshou/internal/version.Version=${VERSION} \
            -X github.com/LuSrackhall/tengshou/internal/version.Commit=${GITHUB_SHA::7}" \
            -o "dist/tengshou-cli-${GOOS}-${GOARCH}${EXT}" ./cmd/tengshou-cli
      - uses: actions/upload-artifact@v4
        with:
          name: tengshou-cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  desktop:
    name: 构建桌面壳（${{ matrix.goos }}）
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            goos: darwin
            goarch: arm64
            cgo: "1"
          - os: windows-latest
            goos: windows
            goarch: amd64
            cgo: "0"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: 取回前端构建产物（go:embed 需要）
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: internal/httpapi/web/app/dist
      - name: vet 桌面壳（cgo）
        if: matrix.goos == 'darwin'
        run: go vet ./cmd/tengshou
      - name: 构建桌面应用
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          VERSION="${GITHUB_REF_NAME:-0.1.0-dev}"
          LDFLAGS="-s -w -X github.com/LuSrackhall/tengshou/internal/version.Version=${VERSION}"
          if [ "$GOOS" = "windows" ]; then LDFLAGS="$LDFLAGS -H windowsgui"; fi
          go build -trimpath -ldflags "$LDFLAGS" -o "dist/tengshou-${GOOS}-${GOARCH}${EXT}" ./cmd/tengshou
      - name: 打包（Windows）
        if: matrix.goos == 'windows'
        shell: pwsh
        run: Compress-Archive -Path dist/tengshou-windows-amd64.exe -DestinationPath dist/tengshou-windows-amd64.zip
      - name: 打包（macOS）
        if: matrix.goos == 'darwin'
        run: |
          cd dist
          tar -czf tengshou-darwin-arm64.tar.gz tengshou-darwin-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: tengshou-desktop-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: 发布预发布版
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, cli, desktop]
    runs-on: ubuntu-latest
    steps:
      # 只取构建产物：frontend-dist 是 cli/desktop 的构建输入，不属于发布资产
      #（发布固定 8 个文件，与 alpha.6 及以前一致）。
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: tengshou-*
          merge-multiple: true
      - name: 列出产物
        run: ls -lh dist
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
