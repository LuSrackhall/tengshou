name: CI

# 发版流程约束：只对已合入 main 且 main 上 CI 全绿的 commit 打 v* tag。
# tag run 跳过单测与三端 E2E（同一 commit 已在 main 上验证），只保留
# 前端构建 + CLI/桌面构建 + 教程 + 发布，把发版墙钟压到 ≤9 分钟
# （教程的慢速录制是硬底）。
on:
  push:
    branches: [main]
    tags: ["v*"]
    # 仅忽略纯文档改动（docs/** 与根级 *.md）；产品代码、脚本、依赖与
    # workflow 自身（.github/**）都不在忽略列表内，改到必然触发。
    # main 未启用分支保护、无 required status checks，跳过不会卡合并。
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:

# 同一 ref 的连续 push 用新 run 取代旧 run：
# - PR：取消进行中的旧 run，避免排队重复跑；
# - main 与 tag：永不取消，避免 main 校验或发版跑一半被打断。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  test:
    name: 测试（Linux）
    # tag run 跳过：同 commit 在 main 上单测已全绿；发版只做构建 + 教程 + 发布。
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: 安装中文字体
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-arphic-uming
          # Noto CJK 的 CFF 集合无法被当前 PDF 子集化器处理；用 AR PL UMing
          # （TrueType，含拉丁与中文）跑测试。
          echo "TENGHSHOU_FONT=/usr/share/fonts/truetype/arphic/uming.ttc" >> "$GITHUB_ENV"
      - name: 静态检查
        run: |
          test -z "$(gofmt -l ./cmd ./internal ./tools)"
          go vet ./internal/... ./cmd/tengshou-cli ./tools/...
      - name: 剩余 shell 脚本静态检查
        run: |
          set -euo pipefail
          # 构建/冒烟/打包已收口到 tools/tengshoubuild，仓库不再保留 .ps1。
          test -z "$(git ls-files '*.ps1')"
          # 1) 所有 shell 脚本必须能通过 bash 语法解析。
          for f in scripts/*.sh; do
            bash -n "$f"
          done
          # 2) 脚本必须是 LF；CRLF 在 Linux/macOS 上会让 shebang 解析失败。
          bad=0
          for f in scripts/*.sh; do
            if grep -q $'\r' "$f"; then
              echo "错误：$f 含 CR（请保持 LF 换行）"
              bad=1
            fi
          done
          exit "$bad"
      - name: 单元与集成测试
        run: go test -count=1 ./internal/... ./cmd/tengshou-cli ./tools/...
      - name: Windows 分发包工具冒烟测试
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          printf 'desktop' > "$tmp/tengshou-windows-amd64.exe"
          go run ./tools/tengshoubuild package-windows-zip "$tmp"
          # 独立校验（不复用打包工具自身的断言）。
          python3 -I - "$tmp/tengshou-windows-amd64.zip" <<'PY'
          import sys
          import zipfile

          expected = sorted([
              "tengshou-windows-amd64.exe",
          ])
          with zipfile.ZipFile(sys.argv[1]) as z:
              got = sorted(z.namelist())
          if got != expected:
              sys.exit(f"错误：Windows zip 内容不符：{got} != {expected}")
          PY
          rm -rf "$tmp"

  frontend:
    name: 前端工程约束与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 结构预算棘轮
        run: bash scripts/check-frontend-structure.sh
      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci
      - name: 类型检查（strict）
        working-directory: frontend
        run: npm run typecheck
      - name: 构建 Vue 岛产物
        working-directory: frontend
        run: npm run build
      - name: 校验 dist 产物
        run: |
          test -f internal/httpapi/web/app/dist/tengshou-ui.js
          test -f internal/httpapi/web/app/dist/tengshou-ui.css
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: internal/httpapi/web/app/dist
          include-hidden-files: true
          if-no-files-found: error

  e2e:
    name: E2E 界面测试（${{ matrix.label }}）
    needs: frontend
    # PR/main 保持全量三端覆盖；tag run 跳过（同 commit 已在 main 验证）。
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ${{ matrix.os }}
    # 三端都安装 Word→PDF 转换器（Linux apt / Windows Chocolatey /
    # macOS Homebrew cask），安装耗时 2–10 分钟（浏览器与安装包缓存命中后
    # 显著缩短）；45 分钟上限只放宽时间，不降低任何测试内容。
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux · Chromium
            artifact: linux-chromium
            cli: dist/tengshou-cli
            pw-dir: ~/.cache/ms-playwright
          - os: windows-latest
            label: Windows · Chromium
            artifact: windows-chromium
            cli: dist/tengshou-cli-windows-amd64.exe
            pw-dir: ~/AppData/Local/ms-playwright
          - os: macos-15
            label: macOS · WebKit
            artifact: macos-webkit
            cli: dist/tengshou-cli
            pw-dir: ~/Library/Caches/ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: 取回前端构建产物（go:embed 需要）
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: internal/httpapi/web/app/dist
      - name: 读取 Playwright 版本（浏览器缓存 key 绑定版本）
        id: pw-version
        working-directory: e2e
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: 恢复 Playwright 浏览器缓存
        id: pw-cache
        uses: actions/cache/restore@v4
        # 缓存只用于提速；恢复失败不阻断，playwright install 会补装缺失浏览器。
        continue-on-error: true
        with:
          path: ${{ matrix.pw-dir }}
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      # LibreOffice 安装包缓存：缓存 key 绑定安装包版本 + runner OS；
      # 恢复失败、命中损坏或下载失败时一律回退到正常安装，不让 E2E 变红。
      - name: 更新 apt 索引并解析 LibreOffice 版本（Linux）
        id: lo-linux
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          # Candidate 形如 4:24.2.7-0ubuntu0.24.04.4，去掉 epoch 冒号后作缓存 key。
          version="$(apt-cache policy libreoffice-writer | awk '/Candidate:/ {print $2}')"
          version="${version#*:}"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: 解析 LibreOffice 版本（macOS）
        id: lo-macos
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          version="$(brew info --cask libreoffice --json=v2 | python3 -c 'import json,sys; print(json.load(sys.stdin)["casks"][0]["version"])')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: 解析 LibreOffice 版本（Windows）
        id: lo-windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $line = @(choco search libreoffice-fresh --exact --limit-output --no-progress)[0]
          if (-not $line -or $line -notmatch '\|') { throw "无法解析 libreoffice-fresh 版本" }
          $version = ($line -split '\|')[1].Trim()
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: 恢复 LibreOffice 安装包缓存（Linux）
        id: lo-cache-linux
        if: runner.os == 'Linux'
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/libreoffice-debs
          key: libreoffice-linux-${{ steps.lo-linux.outputs.version }}
      - name: 恢复 LibreOffice 安装包缓存（macOS）
        id: lo-cache-macos
        if: runner.os == 'macOS'
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          # 安装步骤用独立的 HOMEBREW_CACHE，这里只缓存其中的下载包目录；
          # Homebrew 下载按内容 sha256 命名，命中损坏时 brew 校验失败会
          # 自动重新下载，安装仍走正常流程。
          path: ${{ runner.temp }}/homebrew-cache/downloads
          key: libreoffice-macos-${{ steps.lo-macos.outputs.version }}
      - name: 恢复 LibreOffice 安装包缓存（Windows）
        id: lo-cache-windows
        if: runner.os == 'Windows'
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/libreoffice-choco
          key: libreoffice-windows-${{ steps.lo-windows.outputs.version }}
      - name: 安装中文字体与 LibreOffice（Linux，缓存命中时跳过下载）
        if: runner.os == 'Linux'
        env:
          LO_CACHE_HIT: ${{ steps.lo-cache-linux.outputs.cache-hit }}
        run: |
          set -euo pipefail
          # 先按 SHA256SUMS 校验恢复的安装包，只把校验通过的包回填 apt 缓存；
          # 损坏/缺失的包丢弃，apt 会正常联网补装——缓存问题不会让 E2E 变红。
          cache="$RUNNER_TEMP/libreoffice-debs"
          if [ -f "$cache/SHA256SUMS" ]; then
            while read -r digest name; do
              deb="$cache/$name"
              if [ -f "$deb" ] && [ "$(sha256sum "$deb" | cut -d' ' -f1)" = "$digest" ]; then
                sudo cp -f "$deb" /var/cache/apt/archives/
              else
                echo "丢弃无效的缓存安装包：$name"
              fi
            done < "$cache/SHA256SUMS"
          fi
          # fonts-noto-cjk 供 LibreOffice 渲染 Word 合同；fonts-arphic-uming
          # （TrueType）继续供 Go PDF 子集化使用。
          sudo apt-get install -y fonts-arphic-uming fonts-noto-cjk libreoffice-writer
          echo "TENGHSHOU_FONT=/usr/share/fonts/truetype/arphic/uming.ttc" >> "$GITHUB_ENV"
          # 缓存未命中时收集本次下载的安装包（缓存条目不可覆盖，命中后不重传）。
          if [ "$LO_CACHE_HIT" != "true" ]; then
            mkdir -p "$cache"
            shopt -s nullglob
            debs=(/var/cache/apt/archives/*.deb)
            if [ "${#debs[@]}" -gt 0 ]; then
              cp -f "${debs[@]}" "$cache/"
              ( cd "$cache" && sha256sum ./*.deb > SHA256SUMS )
            fi
            shopt -u nullglob
          fi
      - name: 安装 LibreOffice（Windows，缓存命中时跳过下载）
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LO_CACHE_HIT: ${{ steps.lo-cache-windows.outputs.cache-hit }}
          LO_VERSION: ${{ steps.lo-windows.outputs.version }}
        run: |
          $cache = Join-Path $env:RUNNER_TEMP 'libreoffice-choco'
          # 1) 校验恢复的缓存安装包；清单缺失/不匹配时清空缓存目录，正常下载。
          $manifest = Join-Path $cache 'SHA256SUMS.txt'
          if (Test-Path -LiteralPath $manifest) {
            $ok = $true
            foreach ($line in Get-Content -LiteralPath $manifest) {
              $parts = $line -split '  ', 2
              if ($parts.Count -ne 2) { $ok = $false; break }
              $file = Join-Path $cache $parts[1]
              if (-not (Test-Path -LiteralPath $file)) { $ok = $false; break }
              if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -ne $parts[0]) { $ok = $false; break }
            }
            if (-not $ok) {
              Write-Warning 'LibreOffice 安装包缓存校验失败，清空缓存目录并重新下载。'
              Remove-Item -Recurse -Force $cache
            }
          }
          # 2) 未命中时下载内部化安装包（nupkg 内嵌 MSI），供本地安装与缓存保存。
          $nupkg = Get-ChildItem -Path $cache -Filter 'libreoffice-fresh*.nupkg' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $nupkg) {
            New-Item -ItemType Directory -Force -Path $cache | Out-Null
            choco download libreoffice-fresh --version=$env:LO_VERSION --internalize --output-directory=$cache --no-progress
            $nupkg = Get-ChildItem -Path $cache -Filter 'libreoffice-fresh*.nupkg' -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          # 3) 优先从缓存包本地安装；任何失败都回退到正常安装，不让缓存拖红 CI。
          $installed = $false
          if ($nupkg) {
            choco install libreoffice-fresh --version=$env:LO_VERSION --source=$cache --no-progress -y
            $installed = ($LASTEXITCODE -eq 0)
            if (-not $installed) { Write-Warning '缓存安装包不可用，回退到正常安装。' }
          }
          if (-not $installed) {
            choco install libreoffice-fresh -y --no-progress
          }
          # 产品检测路径：internal/doctopdf/libreoffice.go 的 Windows 候选。
          $soffice = Join-Path $env:ProgramFiles 'LibreOffice\program\soffice.exe'
          if (-not (Test-Path -LiteralPath $soffice)) {
            throw "LibreOffice 未安装到产品检测路径：$soffice"
          }
          # 4) 缓存未命中时写入校验清单，随后由保存步骤打包缓存。
          if ($env:LO_CACHE_HIT -ne 'true' -and $nupkg) {
            $lines = Get-ChildItem -Path $cache -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | ForEach-Object {
              '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash, $_.Name
            }
            Set-Content -LiteralPath $manifest -Value $lines -Encoding ascii
          }
      - name: 安装 LibreOffice（macOS，缓存命中时跳过下载）
        if: runner.os == 'macOS'
        env:
          # runner 已预装 Homebrew；跳过一次自动更新，把时间留给 cask 安装。
          HOMEBREW_NO_AUTO_UPDATE: "1"
          # 独立的下载缓存目录，只存放本次安装的安装包，便于整体缓存复用。
          HOMEBREW_CACHE: ${{ runner.temp }}/homebrew-cache
        run: |
          # 恢复的 Homebrew 下载缓存命中时跳过下载；
          # 校验失败时 brew 会自动重新下载，安装仍走正常流程。
          brew install --cask libreoffice
          # 产品检测路径：internal/doctopdf/libreoffice.go 的 macOS 候选。
          test -x "/Applications/LibreOffice.app/Contents/MacOS/soffice"
      - name: 构建本端 tengshou-cli（与发布同一命令）
        env:
          CGO_ENABLED: "0"
        run: go run ./tools/tengshoubuild build cli
      - name: 安装 E2E 依赖
        working-directory: e2e
        run: npm ci
      # install 总会执行：缓存命中的浏览器被跳过，缺失/不完整的自动补装。
      - name: 安装 Playwright 浏览器（Linux · Chromium）
        if: runner.os == 'Linux'
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: 安装 Playwright 浏览器（Windows · Chromium）
        if: runner.os == 'Windows'
        working-directory: e2e
        run: npx playwright install chromium
      - name: 安装 Playwright 浏览器（macOS · WebKit）
        if: runner.os == 'macOS'
        working-directory: e2e
        run: npx playwright install webkit
      # 缓存只在未命中时写入；保存失败不影响结论（并发 job 可能已写同 key）。
      - name: 保存 Playwright 浏览器缓存
        if: steps.pw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ matrix.pw-dir }}
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      - name: 保存 LibreOffice 安装包缓存（Linux）
        if: runner.os == 'Linux' && steps.lo-cache-linux.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/libreoffice-debs
          key: libreoffice-linux-${{ steps.lo-linux.outputs.version }}
      - name: 保存 LibreOffice 安装包缓存（macOS）
        if: runner.os == 'macOS' && steps.lo-cache-macos.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/homebrew-cache/downloads
          key: libreoffice-macos-${{ steps.lo-macos.outputs.version }}
      - name: 保存 LibreOffice 安装包缓存（Windows）
        if: runner.os == 'Windows' && steps.lo-cache-windows.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/libreoffice-choco
          key: libreoffice-windows-${{ steps.lo-windows.outputs.version }}
      - name: 运行 E2E 套件
        working-directory: e2e
        env:
          TENGHSHOU_CLI: ${{ github.workspace }}/${{ matrix.cli }}
          # 三端都已安装转换器：真实业务场景验收必须真实运行，
          # 转换器缺失时失败而不是静默跳过。
          E2E_REQUIRE_DOCX: "1"
        run: npx playwright test
      - name: 上传可视报告与工件（每 OS 一份，保留 90 天）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.artifact }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: warn
      - name: 上传业务验收报告与最终合同（三端各一份，用户可读）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: business-acceptance-${{ matrix.artifact }}
          path: e2e/test-results/business-acceptance
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: warn

  tutorial:
    name: 生成使用教程包（macOS · WebKit）
    # 只在发版标签上生成：教程包作为公开资产随版本发布（单平台即可）。
    # 与 e2e 矩阵共用同一套前端产物与发布形态 CLI，教程来自真实产品运行。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: frontend
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: 取回前端构建产物（go:embed 需要）
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: internal/httpapi/web/app/dist
      - name: 读取 Playwright 版本（浏览器缓存 key 绑定版本）
        id: pw-version
        working-directory: e2e
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: 恢复 Playwright 浏览器缓存
        id: pw-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      - name: 解析 LibreOffice 版本（macOS）
        id: lo-macos
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          version="$(brew info --cask libreoffice --json=v2 | python3 -c 'import json,sys; print(json.load(sys.stdin)["casks"][0]["version"])')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: 恢复 LibreOffice 安装包缓存（macOS）
        id: lo-cache-macos
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          # 安装步骤用独立的 HOMEBREW_CACHE，这里只缓存其中的下载包目录。
          path: ${{ runner.temp }}/homebrew-cache/downloads
          key: libreoffice-macos-${{ steps.lo-macos.outputs.version }}
      - name: 安装 LibreOffice（macOS）
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_CACHE: ${{ runner.temp }}/homebrew-cache
        run: |
          brew install --cask libreoffice
          # 产品检测路径：internal/doctopdf/libreoffice.go 的 macOS 候选。
          test -x "/Applications/LibreOffice.app/Contents/MacOS/soffice"
      - name: 构建 CLI（与发布同一命令）
        env:
          CGO_ENABLED: "0"
        run: go run ./tools/tengshoubuild build cli
      - name: 安装 E2E 依赖与 WebKit
        working-directory: e2e
        run: |
          npm ci
          npx playwright install webkit
      # 与 e2e 矩阵共用同一缓存 key：tag run 填充的缓存供后续 main/PR 使用。
      - name: 保存 Playwright 浏览器缓存
        if: steps.pw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      - name: 保存 LibreOffice 安装包缓存（macOS）
        if: steps.lo-cache-macos.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/homebrew-cache/downloads
          key: libreoffice-macos-${{ steps.lo-macos.outputs.version }}
      - name: 生成使用教程（慢速高清录制 + 章节标题卡）
        working-directory: e2e
        env:
          TENGHSHOU_CLI: ${{ github.workspace }}/dist/tengshou-cli
          E2E_REQUIRE_DOCX: "1"
          # 教程录制模式：slowMo 0.5s、点击圆点 + 波纹、每步 1 秒章节卡。
          E2E_TUTORIAL: "1"
        run: npx playwright test business-acceptance.spec.ts
      - name: 打包教程包（HTML + 录像 + 示例 PDF + SHA256SUMS）
        working-directory: e2e/test-results/business-acceptance
        env:
          ZIP_NAME: tengshou-tutorial-${{ github.ref_name }}.zip
        run: |
          set -euo pipefail
          python3 -I - "$ZIP_NAME" <<'PY'
          import hashlib
          import sys
          import zipfile

          names = ["腾手使用教程.html", "验收过程录像.webm", "房屋租赁合同-已签字盖章.pdf"]
          with open("SHA256SUMS", "w", encoding="utf-8") as out:
              for name in names:
                  with open(name, "rb") as handle:
                      digest = hashlib.sha256(handle.read()).hexdigest()
                  out.write(f"{digest}  {name}\n")
          # 用 zipfile 而不是 zip(1)：中文文件名会写入 UTF-8 标志位，
          # Windows 解压不会乱码。
          with zipfile.ZipFile(sys.argv[1], "w", zipfile.ZIP_DEFLATED) as z:
              for name in names + ["SHA256SUMS"]:
                  z.write(name)
          print("written:", sys.argv[1])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tutorial-package
          path: e2e/test-results/business-acceptance/tengshou-tutorial-*.zip
          if-no-files-found: error
      - name: 上传教程运行产物（排查用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-run
          path: e2e/test-results/business-acceptance
          retention-days: 90
          if-no-files-found: warn

  cli:
    name: 构建 CLI（${{ matrix.goos }}/${{ matrix.goarch }}）
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: 取回前端构建产物（go:embed 需要）
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: internal/httpapi/web/app/dist
      - name: 构建（Go 工具，与本地同一命令；跨架构用 -goos/-goarch）
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
          NAME_SUFFIX: -${{ matrix.goos }}-${{ matrix.goarch }}
        run: go run ./tools/tengshoubuild build -goos ${{ matrix.goos }} -goarch ${{ matrix.goarch }} cli
      - name: 发布形态 MCP stdio 冒烟（Linux CLI：connector 与 serve 同一二进制）
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          go run ./tools/tengshoubuild smoke-mcp \
            dist/tengshou-cli-linux-amd64 \
            dist/tengshou-cli-linux-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: tengshou-cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  desktop:
    name: 构建桌面壳（${{ matrix.goos }}）
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            goos: darwin
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: 取回前端构建产物（go:embed 需要）
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: internal/httpapi/web/app/dist
      - name: vet 桌面壳（cgo）
        if: matrix.goos == 'darwin'
        run: go vet ./cmd/tengshou
      - name: 构建（macOS · Go 工具，与本地同一命令）
        if: matrix.goos == 'darwin'
        env:
          CGO_ENABLED: "1"
          VERSION: ${{ github.ref_name }}
          NAME_SUFFIX: -darwin-arm64
        run: |
          go run ./tools/tengshoubuild build -goos darwin -goarch arm64 desktop
          # 冒烟用的同版 CLI 单独放临时目录，避免混入发布资产。
          OUT="$RUNNER_TEMP/smoke-cli" go run ./tools/tengshoubuild build -goos darwin -goarch arm64 cli
      - name: MCP stdio 冒烟（macOS 桌面二进制 + 管道）
        if: matrix.goos == 'darwin'
        run: |
          go run ./tools/tengshoubuild smoke-mcp \
            dist/tengshou-darwin-arm64 \
            "$RUNNER_TEMP/smoke-cli/tengshou-cli-darwin-arm64"
      - name: 打包（macOS）
        if: matrix.goos == 'darwin'
        run: |
          cd dist
          tar -czf tengshou-darwin-arm64.tar.gz tengshou-darwin-arm64
      - name: 构建（Windows · Go 工具，与本地同一命令）
        if: matrix.goos == 'windows'
        env:
          VERSION: ${{ github.ref_name }}
        run: go run ./tools/tengshoubuild build -goos windows -goarch amd64
      - name: MCP stdio 冒烟（Windows GUI 子系统 · 管道）
        if: matrix.goos == 'windows'
        run: go run ./tools/tengshoubuild smoke-mcp dist/tengshou-windows-amd64.exe dist/tengshou-cli-windows-amd64.exe
      - uses: actions/upload-artifact@v4
        if: matrix.goos == 'darwin'
        with:
          name: tengshou-desktop-darwin-arm64
          path: |
            dist/tengshou-darwin-arm64
            dist/tengshou-darwin-arm64.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.goos == 'windows'
        with:
          name: tengshou-desktop-windows-amd64
          path: |
            dist/tengshou-windows-amd64.exe
            dist/tengshou-cli-windows-amd64.exe
          if-no-files-found: error

  release:
    name: 发布预发布版
    if: startsWith(github.ref, 'refs/tags/v')
    # tag run 不再等待单测（同 commit 在 main 上已全绿）；三端 E2E 也不在 tag 上运行。
    needs: [cli, desktop, tutorial]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # 只取构建产物：frontend-dist 是 cli/desktop 的构建输入，不属于发布资产。
      # dist 共 8 个构建产物；其中完整 CLI 4 个不进发布页，发布页只上传 4 个客户端资产与 1 个使用教程包。
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: tengshou-*
          merge-multiple: true
      - name: 取回使用教程包（HTML + 录像 + 示例 PDF + SHA256SUMS）
        uses: actions/download-artifact@v4
        with:
          name: tutorial-package
          path: dist
      - name: 列出产物
        run: ls -lh dist
      - name: 打包 Windows 分发包（仅桌面 exe）
        run: go run ./tools/tengshoubuild package-windows-zip dist
      - name: 校验构建产物（9 个）、发布清单（5 个：4 客户端 + 1 教程包）与包内容
        run: |
          set -euo pipefail
          # 7 个下载产物 + Windows zip + 教程包 = 9。
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 9
          # 发布页只上传客户端资产与使用教程包；完整 CLI（serve/backup/restore/
          # demo 等运维用途）仅作为 CI 构建产物，不进发布页。
          release_files=(
            dist/tengshou-windows-amd64.zip
            dist/tengshou-windows-amd64.exe
            dist/tengshou-darwin-arm64
            dist/tengshou-darwin-arm64.tar.gz
            "dist/tengshou-tutorial-${GITHUB_REF_NAME}.zip"
          )
          test "${#release_files[@]}" -eq 5
          for f in "${release_files[@]}"; do test -f "$f"; done
          if printf '%s\n' "${release_files[@]}" | grep -q 'tengshou-cli'; then
            echo "错误：发布清单不得包含 CLI" >&2
            exit 1
          fi
          unzip -l dist/tengshou-windows-amd64.zip
          # 独立校验（不复用打包工具自身的断言）。
          python3 -I - <<'PY'
          import sys
          import zipfile

          expected = sorted([
              "tengshou-windows-amd64.exe",
          ])
          with zipfile.ZipFile("dist/tengshou-windows-amd64.zip") as z:
              got = sorted(z.namelist())
          if got != expected:
              sys.exit(f"错误：Windows zip 内容不符：{got} != {expected}")
          print("Windows zip 内容校验通过：" + "、".join(got))
          PY
          # 教程包必须恰好包含教程 HTML、录像、示例 PDF 与 SHA256SUMS，
          # 且 SHA256SUMS 与包内文件真实一致。
          python3 -I - <<'PY'
          import glob
          import hashlib
          import sys
          import zipfile

          paths = glob.glob("dist/tengshou-tutorial-*.zip")
          if len(paths) != 1:
              sys.exit(f"错误：应恰有 1 个教程包，实际 {len(paths)} 个")
          zip_path = paths[0]
          files = [
              "腾手使用教程.html",
              "验收过程录像.webm",
              "房屋租赁合同-已签字盖章.pdf",
          ]
          expected = sorted(files + ["SHA256SUMS"])
          with zipfile.ZipFile(zip_path) as z:
              names = sorted(z.namelist())
              if names != expected:
                  sys.exit(f"错误：教程包内容不符：{names} != {expected}")
              sums = {}
              for line in z.read("SHA256SUMS").decode("utf-8").splitlines():
                  digest, name = line.split("  ", 1)
                  sums[name] = digest
              for name in files:
                  got = hashlib.sha256(z.read(name)).hexdigest()
                  if got != sums.get(name):
                      sys.exit(f"错误：{name} 的 SHA256 与 SHA256SUMS 不一致")
          print("教程包校验通过：" + "、".join(expected))
          PY
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          # 只发布客户端资产与使用教程包；完整 CLI 不发布（需要时从 CI 构建产物或源码构建获取）。
          files: |
            dist/tengshou-windows-amd64.zip
            dist/tengshou-windows-amd64.exe
            dist/tengshou-darwin-arm64
            dist/tengshou-darwin-arm64.tar.gz
            dist/tengshou-tutorial-${{ github.ref_name }}.zip
          fail_on_unmatched_files: true
