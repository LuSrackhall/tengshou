name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: 测试（Linux）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: 安装中文字体
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-arphic-uming
          # Noto CJK 的 CFF 集合无法被当前 PDF 子集化器处理；用 AR PL UMing
          # （TrueType，含拉丁与中文）跑测试。
          echo "TENGHSHOU_FONT=/usr/share/fonts/truetype/arphic/uming.ttc" >> "$GITHUB_ENV"
      - name: 静态检查
        run: |
          test -z "$(gofmt -l ./cmd ./internal ./tools)"
          go vet ./internal/... ./cmd/tengshou-cli ./tools/...
      - name: 剩余 shell 脚本静态检查
        run: |
          set -euo pipefail
          # 构建/冒烟/打包已收口到 tools/tengshoubuild，仓库不再保留 .ps1。
          test -z "$(git ls-files '*.ps1')"
          # 1) 所有 shell 脚本必须能通过 bash 语法解析。
          for f in scripts/*.sh; do
            bash -n "$f"
          done
          # 2) 脚本必须是 LF；CRLF 在 Linux/macOS 上会让 shebang 解析失败。
          bad=0
          for f in scripts/*.sh; do
            if grep -q $'\r' "$f"; then
              echo "错误：$f 含 CR（请保持 LF 换行）"
              bad=1
            fi
          done
          exit "$bad"
      - name: 单元与集成测试
        run: go test -count=1 ./internal/... ./cmd/tengshou-cli ./tools/...
      - name: Windows 分发包工具冒烟测试
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          printf 'desktop' > "$tmp/tengshou-windows-amd64.exe"
          go run ./tools/tengshoubuild package-windows-zip "$tmp"
          # 独立校验（不复用打包工具自身的断言）。
          python3 -I - "$tmp/tengshou-windows-amd64.zip" <<'PY'
          import sys
          import zipfile

          expected = sorted([
              "tengshou-windows-amd64.exe",
          ])
          with zipfile.ZipFile(sys.argv[1]) as z:
              got = sorted(z.namelist())
          if got != expected:
              sys.exit(f"错误：Windows zip 内容不符：{got} != {expected}")
          PY
          rm -rf "$tmp"

  frontend:
    name: 前端工程约束与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 结构预算棘轮
        run: bash scripts/check-frontend-structure.sh
      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci
      - name: 类型检查（strict）
        working-directory: frontend
        run: npm run typecheck
      - name: 构建 Vue 岛产物
        working-directory: frontend
        run: npm run build
      - name: 校验 dist 产物
        run: |
          test -f internal/httpapi/web/app/dist/tengshou-ui.js
          test -f internal/httpapi/web/app/dist/tengshou-ui.css
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: internal/httpapi/web/app/dist
          include-hidden-files: true
          if-no-files-found: error

  cli:
    name: 构建 CLI（${{ matrix.goos }}/${{ matrix.goarch }}）
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: 取回前端构建产物（go:embed 需要）
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: internal/httpapi/web/app/dist
      - name: 构建（Go 工具，与本地同一命令；跨架构用 -goos/-goarch）
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
          NAME_SUFFIX: -${{ matrix.goos }}-${{ matrix.goarch }}
        run: go run ./tools/tengshoubuild build -goos ${{ matrix.goos }} -goarch ${{ matrix.goarch }} cli
      - name: 发布形态 MCP stdio 冒烟（Linux CLI：connector 与 serve 同一二进制）
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          go run ./tools/tengshoubuild smoke-mcp \
            dist/tengshou-cli-linux-amd64 \
            dist/tengshou-cli-linux-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: tengshou-cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  desktop:
    name: 构建桌面壳（${{ matrix.goos }}）
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            goos: darwin
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: 取回前端构建产物（go:embed 需要）
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: internal/httpapi/web/app/dist
      - name: vet 桌面壳（cgo）
        if: matrix.goos == 'darwin'
        run: go vet ./cmd/tengshou
      - name: 构建（macOS · Go 工具，与本地同一命令）
        if: matrix.goos == 'darwin'
        env:
          CGO_ENABLED: "1"
          VERSION: ${{ github.ref_name }}
          NAME_SUFFIX: -darwin-arm64
        run: |
          go run ./tools/tengshoubuild build -goos darwin -goarch arm64 desktop
          # 冒烟用的同版 CLI 单独放临时目录，避免混入发布资产。
          OUT="$RUNNER_TEMP/smoke-cli" go run ./tools/tengshoubuild build -goos darwin -goarch arm64 cli
      - name: MCP stdio 冒烟（macOS 桌面二进制 + 管道）
        if: matrix.goos == 'darwin'
        run: |
          go run ./tools/tengshoubuild smoke-mcp \
            dist/tengshou-darwin-arm64 \
            "$RUNNER_TEMP/smoke-cli/tengshou-cli-darwin-arm64"
      - name: 打包（macOS）
        if: matrix.goos == 'darwin'
        run: |
          cd dist
          tar -czf tengshou-darwin-arm64.tar.gz tengshou-darwin-arm64
      - name: 构建（Windows · Go 工具，与本地同一命令）
        if: matrix.goos == 'windows'
        env:
          VERSION: ${{ github.ref_name }}
        run: go run ./tools/tengshoubuild build -goos windows -goarch amd64
      - name: MCP stdio 冒烟（Windows GUI 子系统 · 管道）
        if: matrix.goos == 'windows'
        run: go run ./tools/tengshoubuild smoke-mcp dist/tengshou-windows-amd64.exe dist/tengshou-cli-windows-amd64.exe
      - uses: actions/upload-artifact@v4
        if: matrix.goos == 'darwin'
        with:
          name: tengshou-desktop-darwin-arm64
          path: |
            dist/tengshou-darwin-arm64
            dist/tengshou-darwin-arm64.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.goos == 'windows'
        with:
          name: tengshou-desktop-windows-amd64
          path: |
            dist/tengshou-windows-amd64.exe
            dist/tengshou-cli-windows-amd64.exe
          if-no-files-found: error

  release:
    name: 发布预发布版
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, cli, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # 只取构建产物：frontend-dist 是 cli/desktop 的构建输入，不属于发布资产
      #（发布固定 8 个文件，与 alpha.6 及以前一致）。
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: tengshou-*
          merge-multiple: true
      - name: 列出产物
        run: ls -lh dist
      - name: 打包 Windows 分发包（仅桌面 exe）
        run: go run ./tools/tengshoubuild package-windows-zip dist
      - name: 校验发布资产（8 个）与 Windows zip 内容（1 个文件）
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 8
          unzip -l dist/tengshou-windows-amd64.zip
          # 独立校验（不复用打包工具自身的断言）。
          python3 -I - <<'PY'
          import sys
          import zipfile

          expected = sorted([
              "tengshou-windows-amd64.exe",
          ])
          with zipfile.ZipFile("dist/tengshou-windows-amd64.zip") as z:
              got = sorted(z.namelist())
          if got != expected:
              sys.exit(f"错误：Windows zip 内容不符：{got} != {expected}")
          print("Windows zip 内容校验通过：" + "、".join(got))
          PY
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
